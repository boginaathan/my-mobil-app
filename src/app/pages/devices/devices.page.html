<ion-content [fullscreen]="true">
  <div class="sl-content-padding">

    <div class="top-actions">
      <ion-icon name="ellipsis-horizontal"></ion-icon>
      <ion-icon name="add"></ion-icon>
    </div>

    <h1 class="sl-page-title">Devices</h1>

    <div class="device-list">
      @for (device of devices(); track device.id) {
        <div class="device-row" (click)="openDevice(device.id)">
          <div class="device-icon">
            <ion-icon [name]="device.icon"></ion-icon>
          </div>
          <div class="device-info">
            <h4>{{ device.name }}</h4>
            <p>{{ device.room }} · <span [class.auto]="device.mode === 'auto'">{{ device.mode }}</span></p>
          </div>
          <div class="device-spark">
            <app-area-chart [series]="sparkline(device.usage)" [xLabels]="[]" [displayHeight]="48" [showGrid]="false"></app-area-chart>
          </div>
        </div>
      }
    </div>

    <div class="update-banner">
      <h4>Updates available</h4>
      <p>4 devices can be updated to the latest firmware. All updates are recommended.</p>
      <ion-button size="small" fill="solid" shape="round" class="update-btn">Update now</ion-button>
    </div>

  </div>
</ion-content>
